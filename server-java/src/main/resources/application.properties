# Server Configuration
server.port=5000
spring.application.name=placement-portal-backend

# Development Database Configuration (placement_portal_java)
spring.datasource.url=jdbc:mysql://localhost:3306/placement_portal_java?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=placement_app
spring.datasource.password=${PLACEMENT_APP_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration - strictly validate existing Flyway schema
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway: Migrations are executed via dedicated migration runner; disable runtime auto-migration on boot
spring.flyway.enabled=false

# JWT Security Configuration - Requires JWT_SECRET in environment
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRE_MS:604800000}

# Resume Storage Configuration (Decoupled project-level storage)
placement.resume.upload-dir=${RESUME_STORAGE_PATH:${RESUME_UPLOAD_DIR:../storage/resumes}}
resume.storage.path=${placement.resume.upload-dir}
resume.legacy.storage.path=${RESUME_LEGACY_STORAGE_PATH:../server/uploads/resumes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

