# Test Database Configuration (placement_portal_java_test)
spring.datasource.url=jdbc:mysql://localhost:3306/placement_portal_java_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=placement_app
spring.datasource.password=${PLACEMENT_APP_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration for Test Schema Validation - strictly validate test database
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=false

# JWT Security Configuration for Tests
jwt.secret=${JWT_SECRET:test_secure_jwt_signing_key_for_unit_tests_at_least_32_chars!}
jwt.expiration=${JWT_EXPIRE_MS:604800000}

# Isolated Resume Storage for Tests
placement.resume.upload-dir=target/test-resumes
resume.storage.path=${placement.resume.upload-dir}
resume.legacy.storage.path=target/test-legacy-resumes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

